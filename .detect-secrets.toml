[plugins]
base64 = true
hex_high_entropy_strings = true
private_key = true

#################################
# ADF SQL AUTHENTICATION SECRETS
#################################

[[rules]]
description = "ADF SQL encryptedCredential detected"
regex = "\"encryptedCredential\"\\s*:\\s*\"[A-Za-z0-9+/=]{40,}\""
tags = ["adf", "sql", "encrypted", "credential"]

[[rules]]
description = "ADF SQL authentication with username"
regex = "\"authenticationType\"\\s*:\\s*\"SQL\"[\\s\\S]{0,300}?\"userName\"\\s*:\\s*\".+\""
tags = ["adf", "sql", "auth"]

[[rules]]
description = "ADF SQL LinkedService without KeyVault"
regex = "\"authenticationType\"\\s*:\\s*\"SQL\"[\\s\\S]{0,500}?(\"password\"|\"encryptedCredential\")"
tags = ["adf", "sql", "no-keyvault"]

#################################
# ADF SQL SERVER METADATA (OPTIONAL)
# Enable only if you want strict blocking
#################################

[[rules]]
description = "ADF SQL server name committed"
regex = "\"server\"\\s*:\\s*\".*\\.database\\.windows\\.net\""
tags = ["adf", "sql", "metadata"]

[[rules]]
description = "ADF SQL database name committed"
regex = "\"database\"\\s*:\\s*\"sqldb-.*\""
tags = ["adf", "sql", "metadata"]

############################
# STORAGE & CLOUD KEYS
############################

[[rules]]
description = "ADF Storage Account access key"
regex = "\"accountKey\"\\s*:\\s*\"[A-Za-z0-9+/=]{40,}\""
tags = ["adf", "storage", "key"]

[[rules]]
description = "ADF Blob / ADLS connection string"
regex = "\"connectionString\"\\s*:\\s*\"DefaultEndpointsProtocol=.*AccountKey=.*\""
tags = ["adf", "storage"]

[[rules]]
description = "ADF AWS access key"
regex = "\"accessKeyId\"\\s*:\\s*\"AKIA[0-9A-Z]{16}\""
tags = ["adf", "aws"]

[[rules]]
description = "ADF AWS secret key"
regex = "\"secretAccessKey\"\\s*:\\s*\"[A-Za-z0-9/+=]{40}\""
tags = ["adf", "aws"]

############################
# API & AUTH SECRETS
############################

[[rules]]
description = "ADF API key or token"
regex = "\"(apiKey|authToken|bearerToken)\"\\s*:\\s*\"[A-Za-z0-9\\-_\\.]{20,}\""
tags = ["adf", "api"]

[[rules]]
description = "ADF OAuth client secret"
regex = "\"clientSecret\"\\s*:\\s*\"(?!@Microsoft.KeyVault).*\""
tags = ["adf", "oauth"]

############################
# ARM TEMPLATE PARAMETERS
############################

[[rules]]
description = "ARM parameter hardcoded secret"
regex = "\"type\"\\s*:\\s*\"string\"[\\s\\S]*?\"defaultValue\"\\s*:\\s*\".+\""
tags = ["arm", "adf", "parameter"]

############################
# GENERIC ADF SECRET FIELD
############################

[[rules]]
description = "ADF generic secret field"
regex = "\"(secret|token|key|pwd)\"\\s*:\\s*\"(?!@Microsoft.KeyVault).*\""
tags = ["adf", "generic"]