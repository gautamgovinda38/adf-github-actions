name: Deploy ADF Templates
on:
    push:
        branches:
            - main
permissions:
    id-token: write
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            # Installs Node and the npm packages saved in your package.json file in the build
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: install ADF Utilities package
              run: npm install
              working-directory: ${{github.workspace}}/build # (1) provide the folder location of the package.json file

            - name: Validate and Generate ARM template
              run: npm run build export ${{github.workspace}}/ /subscriptions/9a4ab8f0-edfb-441d-8ca4-1f7e2bff7866/resourceGroups/rg-dev-data-south-india/providers/Microsoft.DataFactory/factories/adf-orders-dev-india-0000000002025  "ExportedArmTemplate" # (3) The build command, as validate, needs the root folder location of your repository where all the objects are stored. And the 2nd parameter is the resourceID of the ADF instance. The 3rd parameter is the exported ARM template artifact name
              working-directory: ${{github.workspace}}/build

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Update ARM template parameters from config
              run: |
                  python scripts/update_arm_template.py ${{github.workspace}}/build/ExportedArmTemplate/ARMTemplateParametersForFactory.json ${{github.workspace}}/configs/adf_params_uat.json
            # Deploy to UAT Data Factory using Azure/data-factory-deploy-action
            - name: Login via Az module
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  enable-AzPSSession: true

            - name: data-factory-deploy
              uses: Azure/data-factory-deploy-action@v1.2.0
              with:
                  resourceGroupName: rg-uat-data-south-india
                  dataFactoryName: adf-uat-orders-south-india-000000002026
                  armTemplateFile: ${{github.workspace}}/build/ExportedArmTemplate/ARMTemplateForFactory.json
                  armTemplateParametersFile: ${{github.workspace}}/build/ExportedArmTemplate/ARMTemplateParametersForFactory.json
                  #additionalParameters: ls_az_data_lake_properties_typeProperties_baseUrl=https://akv-adf-test-cicd.vault.azure.net/ ls_az_datalake_kv_properties_typeProperties_url=https://dltestcicd.dfs.core.windows.net

                  # skipAzModuleInstallation:  # Parameters which skip the Az module installation. Optional, default is false.
